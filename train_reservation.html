<!DOCTYPE html>
<head>
    <title>train booking!!</title>
</head>
<style>
    body{background-color: rgb(223, 167, 204);font-family: Arial;}
</style>
<body>
    <h1><i><u>train reservation system</u></i></h1>
    <h2><u>admin</u></h2>
    username:<input type="text" name="username"><br><br>
    password:<input type="password" name="password"><br><br>
    <button type="submit">login</button>
    <h2><u>user</u></h2>
    <input type="text" name="user" placeholder="username"><br><br>
    <input type="password" name="pass" placeholder="password"><br><br>
    <button type="submit">login</button>
    <h3>search for trains!!</h3>
    <input type="text" name="search" placeholder="search trains"><br><br>
    <button>search</button>
    <h3>book</h3>
    <table border="1" cellpadding="10">
        <tr><th>book a train</th><th>reservation status</th></tr>
        <tr><th>cancel booking</th><th>track train location</th></tr>
        <tr><th>seat details</th><th>download ticket</th></tr>
    </table>
    <h3><u>available trains:-</u></h3>
    <form>
        <option>train 1: chennai express</option>
        <option>train 2: chn -> blr </option>
        <option>train 3: hyd -> del</option>
        <option>train 4: mumbai -> pune</option>
    </form>
    <button>search</button>
</body>
