<!DOCTYPE html>
<head>
    <title>library</title>
</head>
<style>
    body{background-color: rgb(187, 227, 227);font-family: Arial;}
</style>
<body>
    <h1><i><u>library management system</u></i></h1>
    <h2>admin</h2>
    username:<input type="text" name="username"><br><br>
    password:<input type="password" name="password"><br><br>
    <button type="submit">login</button>
    <h2>user</h2>
    <input type="text" name="user" placeholder="username"><br><br>
    <input type="password" name="pass" placeholder="password"><br><br>
    <button type="submit">login</button>
    <h3>search book</h3>
    <input type="text" name="search" placeholder="search book"><br><br>
    <button>search</button>
    <h3>book</h3>
    <table border="1" cellpadding="10">
        <tr><th>book</th><th>status</th></tr>
        <tr><th>rent</th><th>available</th></tr>
        <tr><th>author</th><th>issued</th></tr>
    </table>
    <h3>study material</h3>
    <select>
        <option>c++ book</option>
        <option>java book</option>
        <option>intro to python programming</option>
        <option>php basics</option>
    </select>
    <button>search</button>
</body>
