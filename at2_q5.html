
<!DOCTYPE html>
<html>
<head>
    <title>Browser-Server Communication</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f4f7fb;
            padding: 20px;
        }
        .step {
            background: white;
            border: 2px solid #2878b5;
            border-radius: 10px;
            padding: 15px;
            margin: auto;
            width: 280px;
            cursor: pointer;
        }
        .arrow {
            font-size: 25px;
            margin: 8px;
        }
        #info {
            margin: 20px auto;
            padding: 15px;
            max-width: 400px;
            background: #dceeff;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <h1>Browser–Server Communication</h1>

    <div class="step" onclick="show(0)">
        1. User Enters URL
    </div>
    <div class="arrow">↓</div>

    <div class="step" onclick="show(1)">
        2. DNS Lookup
    </div>
    <div class="arrow">↓</div>

    <div class="step" onclick="show(2)">
        3. HTTP Request Sent
    </div>
    <div class="arrow">↓</div>

    <div class="step" onclick="show(3)">
        4. Server Processes Request
    </div>
    <div class="arrow">↓</div>

    <div class="step" onclick="show(4)">
        5. HTTP Response Returned
    </div>
    <div class="arrow">↓</div>

    <div class="step" onclick="show(5)">
        6. Browser Renders Page
    </div>

    <div id="info">
        Click any step to see its explanation.
    </div>

    <script>
        const details = [
            "The user enters a website address in the browser.",
            "DNS converts the domain name into an IP address.",
            "The browser sends an HTTP request to the server.",
            "The server processes the request and prepares content.",
            "The server returns a response with status, headers and content.",
            "The browser processes HTML, CSS and JavaScript to display the page."
        ];

        function show(index) {
            document.getElementById("info").textContent =
                details[index];
        }
    </script>
</body>
</html>
